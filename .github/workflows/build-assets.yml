name: Build assets

# On every push to main: compile the front-end and commit the built files back
# to the repo. The LIVE server picks the new commit up on its next cron pull
# (deploy/server-pull.sh) — no secrets or cPanel API token needed here.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/js/**'
      - 'public/css/**'
      - 'public/mix-manifest.json'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build production assets
        run: npm run prod

      - name: Commit compiled assets (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/js public/css public/mix-manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore(build): compile front-end assets [skip ci]"
            git push origin HEAD:main
          fi

