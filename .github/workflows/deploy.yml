name: Deploy to live (cPanel)

# Build front-end assets on every push to main, commit the compiled output
# back to the repo, then tell cPanel to pull HEAD and run .cpanel.yml.
on:
  push:
    branches: [main]
    # The auto-commit below only touches compiled assets — ignore those paths
    # so the workflow never triggers itself in a loop.
    paths-ignore:
      - 'public/js/**'
      - 'public/css/**'
      - 'public/mix-manifest.json'
  workflow_dispatch: {}

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # need a real history to commit + push back
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build production assets
        run: npm run prod

      - name: Commit compiled assets (if changed)
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/js public/css public/mix-manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore(build): compile front-end assets [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  trigger-cpanel:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Ask cPanel to pull & deploy HEAD
        env:
          CPANEL_HOST:      ${{ secrets.CPANEL_HOST }}       # e.g. server123.web-hosting.com  (NO https://, NO port)
          CPANEL_USER:      ${{ secrets.CPANEL_USER }}       # cPanel account username
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}  # cPanel -> Manage API Tokens
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}  # absolute path of the repo checkout on the server
        run: |
          set -euo pipefail

          echo "Updating clone from GitHub..."
          curl -fsS -G "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}" \
            | tee /tmp/deploy.json

          # VersionControlDeployment::create queues the deploy; surface failures.
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/deploy.json'))
          if not d.get('status'):
              print('cPanel API error:', d.get('errors') or d)
              sys.exit(1)
          print('Deployment queued:', d.get('data'))
          PY
