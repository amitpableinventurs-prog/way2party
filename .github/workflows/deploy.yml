name: Deploy

# On every push to main: SSH into the live server and run deploy/server-pull.sh
# (git reset --hard origin/main + composer install + migrate --force + cache rebuild).
#
# Front-end assets are NOT rebuilt here — whatever is committed under public/js,
# public/css, public/mix-manifest.json is what ships. If you change anything under
# resources/js or resources/css, run `npm run prod` locally and commit the result.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    # Runs only once the server is wired up. Set repo variable DEPLOY_ENABLED=true
    # (Settings ▸ Secrets and variables ▸ Actions ▸ Variables) after adding the
    # SSH_* / DEPLOY_PATH secrets. Until then this job is skipped (workflow green).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run server-pull.sh on the live server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            bash deploy/server-pull.sh

# Requires repo SECRETS (Settings ▸ Secrets and variables ▸ Actions ▸ Secrets tab —
# NOT the Variables tab; SSH_KEY must never be a variable):
#   SSH_HOST      3.0.159.67
#   SSH_USER      way2party
#   SSH_PORT      22
#   SSH_KEY       -----BEGIN OPENSSH PRIVATE KEY----- …   (private half; public half in
#                 the server's ~/.ssh/authorized_keys)
#   DEPLOY_PATH   /home/way2party/…   (the Laravel root on the server)
# and one repo VARIABLE (Variables tab):
#   DEPLOY_ENABLED   true
